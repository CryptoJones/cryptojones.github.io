---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>

  {% if page.video %}
    <div style="position:relative; padding-bottom:56.25%; height:0; overflow:hidden; margin-bottom:1rem;">
      <iframe src="https://www.youtube.com/embed/{{ page.video }}" title="{{ page.video_title | default: page.title }}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen style="position:absolute; top:0; left:0; width:100%; height:100%;"></iframe>
    </div>
  {% endif %}

  {% if page.audio %}
    {% include article-audio.html %}
  {% endif %}

  <div class="entry">
    {{ content }}
  </div>

  <div class="date">
    Written on {{ page.date | date: "%B %e, %Y" }}
  </div>

  {% include disqus.html %}
</article>
