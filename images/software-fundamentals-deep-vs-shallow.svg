<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Menlo, Consolas, monospace">
  <defs>
    <filter id="g2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/><feMerge>
      <feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="540" fill="#07090f"/>
  <text x="40" y="50" fill="#27d4ff" font-size="26" filter="url(#g2)" letter-spacing="1">deep modules vs shallow modules</text>
  <text x="40" y="78" fill="#5a6678" font-size="15">the same code, laid out two ways &#8212; and only one is testable</text>

  <line x1="480" y1="105" x2="480" y2="510" stroke="#1c2230" stroke-width="1.4"/>

  <!-- ===================== SHALLOW (bad) ===================== -->
  <text x="60" y="132" fill="#ff4f4f" font-size="20" filter="url(#g2)">SHALLOW</text>
  <text x="60" y="154" fill="#5a6678" font-size="13">lots of tiny modules, each with a fat, fiddly interface</text>

  <!-- tangle of edges first, so boxes sit on top -->
  <g stroke="#3a2130" stroke-width="1.3" fill="none">
    <path d="M110,230 C180,210 240,300 300,250"/>
    <path d="M150,300 C230,330 300,240 360,320"/>
    <path d="M110,360 C200,340 250,420 340,390"/>
    <path d="M300,250 C340,300 200,360 150,420"/>
    <path d="M240,210 C300,250 360,220 400,300"/>
    <path d="M120,420 C220,440 320,420 400,440"/>
  </g>
  <!-- shallow modules: small body, wide bright interface bar on top -->
  <g font-size="11" text-anchor="middle">
    <!-- each module = interface bar (bright, wide) + tiny body -->
    <g>
      <rect x="80" y="200" width="90" height="9" fill="#ff4f4f"/>
      <rect x="80" y="209" width="90" height="26" fill="#170e12" stroke="#5a2733" stroke-width="1"/>
    </g>
    <g>
      <rect x="210" y="185" width="90" height="9" fill="#ff4f4f"/>
      <rect x="210" y="194" width="90" height="26" fill="#170e12" stroke="#5a2733" stroke-width="1"/>
    </g>
    <g>
      <rect x="345" y="255" width="90" height="9" fill="#ff4f4f"/>
      <rect x="345" y="264" width="90" height="26" fill="#170e12" stroke="#5a2733" stroke-width="1"/>
    </g>
    <g>
      <rect x="110" y="300" width="90" height="9" fill="#ff4f4f"/>
      <rect x="110" y="309" width="90" height="26" fill="#170e12" stroke="#5a2733" stroke-width="1"/>
    </g>
    <g>
      <rect x="255" y="330" width="90" height="9" fill="#ff4f4f"/>
      <rect x="255" y="339" width="90" height="26" fill="#170e12" stroke="#5a2733" stroke-width="1"/>
    </g>
    <g>
      <rect x="95" y="390" width="90" height="9" fill="#ff4f4f"/>
      <rect x="95" y="399" width="90" height="26" fill="#170e12" stroke="#5a2733" stroke-width="1"/>
    </g>
    <g>
      <rect x="330" y="385" width="90" height="9" fill="#ff4f4f"/>
      <rect x="330" y="394" width="90" height="26" fill="#170e12" stroke="#5a2733" stroke-width="1"/>
    </g>
  </g>
  <text x="60" y="470" fill="#ff4f4f" font-size="13">the AI wanders this maze and never learns what your code does.</text>

  <!-- ===================== DEEP (good) ===================== -->
  <text x="520" y="132" fill="#55ff99" font-size="20" filter="url(#g2)">DEEP</text>
  <text x="520" y="154" fill="#5a6678" font-size="13">a few large modules, each behind one simple interface</text>

  <!-- deep modules: small simple interface tab on top, big body with hidden internals -->
  <g text-anchor="middle" font-size="14">
    <!-- module 1 -->
    <rect x="540" y="185" width="120" height="10" rx="3" fill="#27d4ff"/>
    <rect x="530" y="195" width="140" height="130" rx="6" fill="#0c1018" stroke="#27d4ff" stroke-width="1.6"/>
    <g stroke="#1c2a33" stroke-width="1"><line x1="548" y1="225" x2="652" y2="225"/><line x1="548" y1="248" x2="652" y2="248"/><line x1="548" y1="271" x2="620" y2="271"/><line x1="548" y1="294" x2="640" y2="294"/></g>
    <text x="600" y="345" fill="#d7e0ee" font-size="12">hidden complexity</text>
    <!-- module 2 -->
    <rect x="710" y="185" width="120" height="10" rx="3" fill="#55ff99"/>
    <rect x="700" y="195" width="140" height="130" rx="6" fill="#0c1018" stroke="#55ff99" stroke-width="1.6"/>
    <g stroke="#1c2a33" stroke-width="1"><line x1="718" y1="225" x2="822" y2="225"/><line x1="718" y1="248" x2="822" y2="248"/><line x1="718" y1="271" x2="790" y2="271"/><line x1="718" y1="294" x2="810" y2="294"/></g>
    <text x="770" y="345" fill="#d7e0ee" font-size="12">hidden complexity</text>
    <!-- module 3 wide -->
    <rect x="600" y="370" width="120" height="10" rx="3" fill="#ffb000"/>
    <rect x="540" y="380" width="300" height="70" rx="6" fill="#0c1018" stroke="#ffb000" stroke-width="1.6"/>
    <g stroke="#2a2210" stroke-width="1"><line x1="558" y1="410" x2="822" y2="410"/><line x1="558" y1="430" x2="760" y2="430"/></g>
  </g>
  <text x="520" y="482" fill="#55ff99" font-size="13">test at the simple boundary. this codebase rewards TDD.</text>
  <text x="520" y="504" fill="#5a6678" font-size="12">design the interface yourself; let the AI own the implementation inside.</text>
</svg>
