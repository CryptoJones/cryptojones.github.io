<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="Menlo, Consolas, monospace">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/><feMerge>
      <feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5a6678"/>
    </marker>
    <marker id="arwR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ff4f4f"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#07090f"/>
  <text x="40" y="52" fill="#27d4ff" font-size="26" filter="url(#glow)" letter-spacing="1">specs-to-code: the entropy loop</text>
  <text x="40" y="80" fill="#5a6678" font-size="15">&#8220;you don&#8217;t read the code &#8212; you just fix the spec and run it again&#8221;</text>

  <!-- the loop -->
  <g font-size="17">
    <rect x="70"  y="130" width="180" height="70" rx="8" fill="#11151f" stroke="#27d4ff" stroke-width="1.6"/>
    <text x="160" y="163" fill="#d7e0ee" text-anchor="middle">SPEC</text>
    <text x="160" y="185" fill="#5a6678" font-size="13" text-anchor="middle">what it should do</text>

    <rect x="390" y="130" width="180" height="70" rx="8" fill="#11151f" stroke="#55ff99" stroke-width="1.6"/>
    <text x="480" y="163" fill="#d7e0ee" text-anchor="middle">AI</text>
    <text x="480" y="185" fill="#5a6678" font-size="13" text-anchor="middle">turns spec into code</text>

    <rect x="710" y="130" width="180" height="70" rx="8" fill="#11151f" stroke="#ffb000" stroke-width="1.6"/>
    <text x="800" y="163" fill="#d7e0ee" text-anchor="middle">CODE</text>
    <text x="800" y="185" fill="#5a6678" font-size="13" text-anchor="middle">nobody looks</text>

    <line x1="250" y1="165" x2="384" y2="165" stroke="#5a6678" stroke-width="1.6" marker-end="url(#arw)"/>
    <line x1="570" y1="165" x2="704" y2="165" stroke="#5a6678" stroke-width="1.6" marker-end="url(#arw)"/>
    <!-- return arrow: code -> spec, the re-run -->
    <path d="M800,200 C800,270 160,270 160,206" fill="none" stroke="#ff4f4f" stroke-width="1.6" marker-end="url(#arwR)"/>
    <text x="480" y="262" fill="#ff4f4f" font-size="14" text-anchor="middle">run the compiler again</text>
  </g>

  <!-- degradation strip -->
  <text x="40" y="330" fill="#5a6678" font-size="14">each pass, the code gets a little worse &#8212; software entropy:</text>
  <g font-size="14" text-anchor="middle">
    <rect x="70"  y="350" width="150" height="46" rx="6" fill="#0c1018" stroke="#55ff99" stroke-width="1.4"/>
    <text x="145" y="378" fill="#55ff99">pass 1 &#183; ok</text>
    <rect x="270" y="350" width="150" height="46" rx="6" fill="#0c1018" stroke="#ffb000" stroke-width="1.4"/>
    <text x="345" y="378" fill="#ffb000">pass 2 &#183; worse</text>
    <rect x="470" y="350" width="150" height="46" rx="6" fill="#0c1018" stroke="#ff4f4f" stroke-width="1.4"/>
    <text x="545" y="378" fill="#ff4f4f">pass 3 &#183; worse</text>
    <rect x="670" y="350" width="200" height="46" rx="6" fill="#1a0d0d" stroke="#ff4f4f" stroke-width="2"/>
    <text x="770" y="378" fill="#ff4f4f" filter="url(#glow)">collapse &#9760;</text>
    <line x1="220" y1="373" x2="266" y2="373" stroke="#5a6678" stroke-width="1.4" marker-end="url(#arw)"/>
    <line x1="420" y1="373" x2="466" y2="373" stroke="#5a6678" stroke-width="1.4" marker-end="url(#arw)"/>
    <line x1="620" y1="373" x2="666" y2="373" stroke="#5a6678" stroke-width="1.4" marker-end="url(#arw)"/>
  </g>
</svg>
