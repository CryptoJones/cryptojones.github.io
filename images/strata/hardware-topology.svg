<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="rtxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="v100Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="hostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" rx="16" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="2"/>
  <rect x="20" y="20" width="960" height="580" rx="12" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Title & Subtitle -->
  <text x="50" y="55" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f9fafb" letter-spacing="0.5">Pluto Heterogeneous GPU Architecture: Qwen 3.8 Flash-Next</text>
  <text x="50" y="78" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9ca3af">Dual Tesla V100 32GB (LLM Engine) + GeForce RTX 3060 12GB (Vision Offload) with Zero Contention</text>

  <!-- Incoming Request Banner -->
  <rect x="50" y="105" width="900" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="75" cy="130" r="10" fill="#38bdf8"/>
  <text x="71" y="134" font-family="monospace" font-size="11" font-weight="bold" fill="#0f172a">API</text>
  <text x="100" y="128" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Client Request: OpenAI / Anthropic API (:8083)</text>
  <text x="100" y="145" font-family="monospace" font-size="11" fill="#94a3b8">POST /v1/chat/completions (Text + Base64 / URL Image Modal Payload)</text>
  
  <rect x="730" y="117" width="205" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="742" y="134" font-family="monospace" font-size="11" fill="#38bdf8">serve/server.py (PID 736865)</text>

  <!-- Flow Arrows from API -->
  <!-- Left arrow to Vision (GPU 0) -->
  <path d="M 280 155 L 280 200 L 200 200 L 200 230" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5 3"/>
  <polygon points="200,235 195,225 205,225" fill="#10b981"/>
  <rect x="175" y="175" width="135" height="20" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="182" y="189" font-family="monospace" font-size="10" fill="#a7f3d0">IPC: Image Chunk</text>

  <!-- Right arrow to LLM (GPUs 1 & 2) -->
  <path d="M 680 155 L 680 200 L 680 230" fill="none" stroke="#818cf8" stroke-width="2"/>
  <polygon points="680,235 675,225 685,225" fill="#818cf8"/>
  <rect x="615" y="175" width="135" height="20" rx="4" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
  <text x="623" y="189" font-family="monospace" font-size="10" fill="#c7d2fe">Tokenized Prompt</text>

  <!-- GPU 0 Box: RTX 3060 -->
  <g transform="translate(50, 240)">
    <rect width="300" height="250" rx="12" fill="#062e24" stroke="#10b981" stroke-width="2"/>
    <!-- Card header -->
    <rect width="300" height="42" rx="12" fill="#047857"/>
    <rect y="30" width="300" height="12" fill="#047857"/>
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">GPU 0: NVIDIA RTX 3060 12GB</text>
    <text x="210" y="26" font-family="monospace" font-size="11" fill="#a7f3d0">sm_86 · PCIe 4.0</text>

    <!-- Vision Process Card -->
    <rect x="15" y="55" width="270" height="85" rx="8" fill="#022c22" stroke="#34d399" stroke-width="1.5"/>
    <text x="25" y="76" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#34d399">strata-vision (PID 736866)</text>
    <text x="25" y="94" font-family="monospace" font-size="11" fill="#d1fae5">mmproj-F16.gguf (Qwen-VL)</text>
    <text x="25" y="112" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9ca3af">VRAM Allocated: <tspan fill="#34d399" font-weight="bold">1,656 MiB</tspan> (~1.65 GB)</text>
    <text x="25" y="128" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9ca3af">Latency: <tspan fill="#34d399" font-weight="bold">~1.6s</tspan> (7.5x faster than CPU)</text>

    <!-- Co-existence Card (ComfyUI) -->
    <rect x="15" y="150" width="270" height="85" rx="8" fill="#132a24" stroke="#059669" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="25" y="171" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">Co-tenant: ComfyUI (PID 748998)</text>
    <text x="25" y="189" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9ca3af">VRAM Occupied: <tspan fill="#e5e7eb" font-weight="bold">9,614 MiB</tspan></text>
    <text x="25" y="207" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9ca3af">Free Buffer: <tspan fill="#6ee7b7" font-weight="bold">~1,018 MiB</tspan> (No contention)</text>
    <text x="25" y="223" font-family="monospace" font-size="10" fill="#34d399">Total Used: 11,293 / 12,288 MiB</text>
  </g>

  <!-- IPC Arrow back from Vision to Main Engine -->
  <path d="M 350 310 L 410 310" fill="none" stroke="#34d399" stroke-width="2"/>
  <polygon points="415,310 405,305 405,315" fill="#34d399"/>
  <rect x="360" y="290" width="45" height="16" rx="3" fill="#064e3b"/>
  <text x="363" y="302" font-family="monospace" font-size="9" fill="#6ee7b7">Tokens</text>

  <!-- Strata LLM Enclosure: GPUs 1 & 2 -->
  <g transform="translate(420, 240)">
    <rect width="530" height="250" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
    <!-- Enclosure Header -->
    <rect width="530" height="42" rx="12" fill="#4338ca"/>
    <rect y="30" width="530" height="12" fill="#4338ca"/>
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Strata LLM MoE Engine (PID 736929) — Dual Tesla V100 32GB Pool (64GB Total)</text>
    <text x="440" y="26" font-family="monospace" font-size="11" fill="#c7d2fe">CUDA 12.9</text>

    <!-- GPU 1: Primary V100 -->
    <g transform="translate(15, 52)">
      <rect width="242" height="183" rx="8" fill="#18153c" stroke="#818cf8" stroke-width="1.5"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc">GPU 1: Tesla V100 (Primary)</text>
      <text x="12" y="38" font-family="monospace" font-size="10" fill="#818cf8">0000:04:00.0 · sm_70 · 32 GB</text>
      <line x1="12" y1="46" x2="230" y2="46" stroke="#312e81" stroke-width="1"/>
      <text x="12" y="64" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0">• <tspan font-weight="600">Layers 0 – 6</tspan> (Dense Prefill)</text>
      <text x="12" y="82" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0">• <tspan font-weight="600">KV Resident Cache:</tspan> 65,536 tokens</text>
      <text x="12" y="100" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0">• <tspan font-weight="600">Prefill Engine:</tspan> 98.0 tok/s</text>
      <text x="12" y="118" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0">• <tspan font-weight="600">Context Limit:</tspan> 262,144 tokens</text>
      <rect x="12" y="132" width="218" height="38" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
      <text x="20" y="148" font-family="monospace" font-size="11" fill="#e9d5ff">VRAM: 32,044 / 32,768 MiB</text>
      <text x="20" y="162" font-family="monospace" font-size="9" fill="#c084fc">97.8% Committed (Zero Headroom loss)</text>
    </g>

    <!-- GPU 2: Secondary V100 -->
    <g transform="translate(272, 52)">
      <rect width="242" height="183" rx="8" fill="#18153c" stroke="#818cf8" stroke-width="1.5"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc">GPU 2: Tesla V100 (Secondary)</text>
      <text x="12" y="38" font-family="monospace" font-size="10" fill="#818cf8">0000:08:00.0 · sm_70 · 32 GB</text>
      <line x1="12" y1="46" x2="230" y2="46" stroke="#312e81" stroke-width="1"/>
      <text x="12" y="64" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0">• <tspan font-weight="600">Layers 7 – 47</tspan> + LM Output Head</text>
      <text x="12" y="82" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0">• <tspan font-weight="600">Locked Expert Cache:</tspan> 8,632 experts</text>
      <text x="12" y="100" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0">• <tspan font-weight="600">Cache Footprint:</tspan> 25.38 GiB locked</text>
      <text x="12" y="118" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0">• <tspan font-weight="600">Generation Speed:</tspan> 62.7 – 64.4 tok/s</text>
      <rect x="12" y="132" width="218" height="38" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
      <text x="20" y="148" font-family="monospace" font-size="11" fill="#e9d5ff">VRAM: 32,010 / 32,768 MiB</text>
      <text x="20" y="162" font-family="monospace" font-size="9" fill="#c084fc">97.7% Committed (Zero Spilling)</text>
    </g>
  </g>

  <!-- Host System RAM Box at the bottom -->
  <g transform="translate(50, 510)">
    <rect width="900" height="85" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fafafa">Host System Memory (128GB DDR4 Host RAM)</text>
    <text x="320" y="28" font-family="monospace" font-size="11" fill="#a1a1aa">PCIe Streaming Layer · Zero Swap</text>
    <text x="20" y="48" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#d4d4d8">Full Expert Set: <tspan font-weight="bold" fill="#38bdf8">71.73 GiB</tspan> mmap-locked into RAM (at 1.52 GiB/s load time) · 97%–99% expert cache hit rate in VRAM avoids PCIe bottleneck.</text>
    <text x="20" y="66" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9ca3af">Routing Governance: <tspan font-family="monospace" fill="#f43f5e" font-weight="bold">STRATA_ROUTE_TAIL_SKIP=0</tspan> and <tspan font-family="monospace" fill="#f43f5e" font-weight="bold">STRATA_ROUTE_BIAS=0</tspan> strictly maintained to prevent quality degradation.</text>
  </g>
</svg>