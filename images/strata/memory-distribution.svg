<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="2"/>
  
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#f9fafb">Physical Memory &amp; VRAM Allocation Map (Pluto)</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#9ca3af">Total Heterogeneous Footprint: 76 GB GPU VRAM (Across 3 GPUs) + 128 GB System RAM</text>

  <!-- Legend -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#10b981"/>
    <text x="22" y="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#d1fae5">strata-vision (mmproj)</text>

    <rect x="180" y="0" width="14" height="14" rx="3" fill="#6366f1"/>
    <text x="202" y="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#e0e7ff">Strata LLM Dense &amp; KV</text>

    <rect x="360" y="0" width="14" height="14" rx="3" fill="#8b5cf6"/>
    <text x="382" y="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#ede9fe">VRAM Locked Experts</text>

    <rect x="540" y="0" width="14" height="14" rx="3" fill="#f59e0b"/>
    <text x="562" y="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#fef3c7">ComfyUI Co-tenant</text>

    <rect x="700" y="0" width="14" height="14" rx="3" fill="#374151"/>
    <text x="722" y="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#9ca3af">Free VRAM Buffer</text>
  </g>

  <!-- BAR 1: GPU 0 (RTX 3060 12GB) -->
  <g transform="translate(40, 140)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#f3f4f6">GPU 0: NVIDIA GeForce RTX 3060 (12,288 MiB Total)</text>
    <text x="680" y="16" font-family="monospace" font-size="11" fill="#34d399">11,293 MiB Allocated (91.9%)</text>
    
    <!-- Outer Track -->
    <rect x="0" y="26" width="880" height="42" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    
    <!-- Segment 1: strata-vision (1,656 MiB -> 118.5px) -->
    <rect x="0" y="26" width="118.5" height="42" rx="6" fill="#10b981"/>
    <!-- Overwrite right radius -->
    <rect x="110" y="26" width="8.5" height="42" fill="#10b981"/>
    <text x="12" y="52" font-family="monospace" font-size="11" font-weight="bold" fill="#022c22">Vision: 1,656M</text>

    <!-- Segment 2: ComfyUI (9,614 MiB -> 688.5px) -->
    <rect x="118.5" y="26" width="688.5" height="42" fill="#f59e0b"/>
    <text x="360" y="52" font-family="monospace" font-size="12" font-weight="bold" fill="#451a03">ComfyUI Co-tenant: 9,614 MiB (P8 idle)</text>

    <!-- Segment 3: Free (1,018 MiB -> 73px) -->
    <text x="815" y="52" font-family="monospace" font-size="10" fill="#9ca3af">~1.0G Free</text>
  </g>

  <!-- BAR 2: GPU 1 (Tesla V100 32GB) -->
  <g transform="translate(40, 230)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#f3f4f6">GPU 1: Tesla V100-PCIE-32GB Primary (32,768 MiB Total)</text>
    <text x="680" y="16" font-family="monospace" font-size="11" fill="#818cf8">32,044 MiB Allocated (97.8%)</text>
    
    <rect x="0" y="26" width="880" height="42" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    
    <!-- Dense layers 0-6 + KV resident cache (32,044 MiB -> 860.5px) -->
    <rect x="0" y="26" width="860.5" height="42" rx="6" fill="#6366f1"/>
    <text x="220" y="52" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">Dense Layers 0–6 + 65k KV Resident Cache: 32,044 MiB</text>
    <text x="866" y="52" font-family="monospace" font-size="9" fill="#9ca3af">724M</text>
  </g>

  <!-- BAR 3: GPU 2 (Tesla PG500-216 32GB) -->
  <g transform="translate(40, 320)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#f3f4f6">GPU 2: Tesla PG500-216 / V100 Secondary (32,768 MiB Total)</text>
    <text x="680" y="16" font-family="monospace" font-size="11" fill="#a855f7">32,010 MiB Allocated (97.7%)</text>
    
    <rect x="0" y="26" width="880" height="42" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    
    <!-- Layers 7-47 (180px) -->
    <rect x="0" y="26" width="180" height="42" rx="6" fill="#6366f1"/>
    <rect x="170" y="26" width="10" height="42" fill="#6366f1"/>
    <text x="18" y="52" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff">Layers 7–47 + Head</text>

    <!-- Expert Cache 8,632 experts (25.38 GiB -> 679.5px) -->
    <rect x="180" y="26" width="679.5" height="42" fill="#8b5cf6"/>
    <text x="320" y="52" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">8,632 Locked Experts (25.38 GiB Locked in VRAM)</text>
    <text x="866" y="52" font-family="monospace" font-size="9" fill="#9ca3af">758M</text>
  </g>

  <!-- Footer Insight -->
  <rect x="40" y="415" width="880" height="40" rx="8" fill="#131d2e" stroke="#1d4ed8" stroke-width="1"/>
  <text x="55" y="439" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#93c5fd">Zero VRAM Contention Guarantee: The RTX 3060 vision process communicates strictly over standard Unix IPC pipes; it never registers or accesses the V100 unified CUDA context.</text>
</svg>