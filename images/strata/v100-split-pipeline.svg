<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="gpu1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="gpu2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="ramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="purpleLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="660" rx="16" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="45" y="48" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="700" fill="#f9fafb">Strata Asymmetric Layer Split (K=17) &amp; Memory Division</text>
  <text x="45" y="72" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#9ca3af">How Strata maps Qwen 3.8 Flash-Next across Dual Tesla V100 32GB GPUs &amp; 128 GB System RAM based on PCIe Bandwidth</text>

  <!-- TOP SECTION: HOST SYSTEM RAM -->
  <g transform="translate(45, 95)">
    <rect width="910" height="135" rx="10" fill="url(#ramGrad)" stroke="#3f3f46" stroke-width="1.5"/>
    <rect width="910" height="32" rx="10" fill="#27272a"/>
    <rect y="22" width="910" height="10" fill="#27272a"/>
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#fafafa">HOST SYSTEM MEMORY (128 GB DDR4 · Linux Cgroup Limit: 110.0 GiB)</text>
    <text x="730" y="22" font-family="monospace" font-size="11" fill="#38bdf8">1.52 GiB/s Mmap Load</text>

    <!-- RAM Item 1: Complete Expert Set -->
    <rect x="16" y="44" width="370" height="78" rx="6" fill="#18181b" stroke="#0284c7" stroke-width="1"/>
    <text x="26" y="65" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Quantized MoE Expert Arena: 71.73 GiB</text>
    <text x="26" y="83" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#d4d4d8">All 24,576 expert pairs mmap locked in RAM</text>
    <text x="26" y="101" font-family="monospace" font-size="10" fill="#7dd3fc">cudaHostRegister PORTABLE (Zero Page Swapping)</text>

    <!-- RAM Item 2: Pinned KV Buffer -->
    <rect x="400" y="44" width="240" height="78" rx="6" fill="#18181b" stroke="#6366f1" stroke-width="1"/>
    <text x="410" y="65" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc">Streaming KV Cache: 1.03 GiB</text>
    <text x="410" y="83" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#d4d4d8">Pinned RAM expansion space</text>
    <text x="410" y="101" font-family="monospace" font-size="10" fill="#c7d2fe">Context: 65,536 -> 262,144 tokens</text>

    <!-- RAM Item 3: CPU Worker Pool -->
    <rect x="654" y="44" width="240" height="78" rx="6" fill="#18181b" stroke="#10b981" stroke-width="1"/>
    <text x="664" y="65" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399">5 CPU Pool Workers + Host</text>
    <text x="664" y="83" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#d4d4d8">Cores 1–5 compute miss fallback</text>
    <text x="664" y="101" font-family="monospace" font-size="10" fill="#a7f3d0">Handles 1.5%–3.0% cache misses</text>
  </g>

  <!-- INTERCONNECT BUSES (PCIe) -->
  <g transform="translate(45, 240)">
    <!-- Bus Left: PCIe Gen3 x4 -->
    <path d="M 210 0 L 210 50" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 2"/>
    <polygon points="210,55 205,45 215,45" fill="#f59e0b"/>
    <rect x="110" y="12" width="200" height="26" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="120" y="29" font-family="monospace" font-size="11" font-weight="bold" fill="#fef3c7">PCIe Gen3 x4 (2.9 GB/s)</text>

    <!-- Bus Right: PCIe Gen3 x16 -->
    <path d="M 690 0 L 690 50" fill="none" stroke="#10b981" stroke-width="3"/>
    <polygon points="690,55 684,43 696,43" fill="#10b981"/>
    <rect x="585" y="12" width="210" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="595" y="29" font-family="monospace" font-size="11" font-weight="bold" fill="#d1fae5">PCIe Gen3 x16 (13.1 GB/s)</text>

    <text x="350" y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#9ca3af">← 4.5x Bandwidth Asymmetry steers expert cache to Stage 1 →</text>
  </g>

  <!-- LOWER SECTION: THE TWO V100 GPUs -->
  <!-- GPU 1: Stage 0 (Layers 0..16) -->
  <g transform="translate(45, 305)">
    <rect width="440" height="310" rx="10" fill="url(#gpu1Grad)" stroke="#6366f1" stroke-width="2"/>
    <rect width="440" height="36" rx="10" fill="#312e81"/>
    <rect y="26" width="440" height="10" fill="#312e81"/>
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">GPU 1: Tesla V100-PCIE-32GB (CUDA 0)</text>
    <text x="340" y="24" font-family="monospace" font-size="11" fill="#c7d2fe">Bus 04:00.0</text>

    <!-- Sub-blocks for GPU 1 -->
    <rect x="15" y="48" width="410" height="48" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
    <text x="25" y="68" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc">Transformer Layers 0 – 16 (17 Dense Layers)</text>
    <text x="25" y="85" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" fill="#cbd5e1">Q8_0 Token Embeddings (644 MB) + Projection Matrices (2,975 MB)</text>

    <rect x="15" y="104" width="410" height="48" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="124" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Dynamic Prefill Arena: 4.09 GiB</text>
    <text x="25" y="141" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" fill="#cbd5e1">8,192-token chunk buffer · Sustains 98.0 tok/s prompt ingestion</text>

    <rect x="15" y="160" width="410" height="48" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="1"/>
    <text x="25" y="180" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#c084fc">MTP Speculative Draft Layer: 837 MiB</text>
    <text x="25" y="197" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" fill="#cbd5e1">Spec 4 draft verification · 63%–75% acceptance rate</text>

    <rect x="15" y="216" width="410" height="44" rx="6" fill="#1e1b4b" stroke="#10b981" stroke-width="1"/>
    <text x="25" y="234" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">KV Resident Cache &amp; L1 Expert Pool: 2.63 GiB</text>
    <text x="25" y="250" font-family="monospace" font-size="10" fill="#a7f3d0">65k tokens (0.5G) + 630 expert slots (2.13G) + 700M vision reserve</text>

    <rect x="15" y="268" width="410" height="30" rx="5" fill="#312e81"/>
    <text x="120" y="288" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">TOTAL VRAM: 32,044 / 32,768 MiB (97.8%)</text>
  </g>

  <!-- PIPELINE ARROW BETWEEN GPU 1 AND GPU 2 -->
  <g transform="translate(485, 430)">
    <path d="M 5 0 L 25 0" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="30,0 20,-6 20,6" fill="#38bdf8"/>
    <rect x="-10" y="-28" width="50" height="20" rx="3" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
    <text x="-6" y="-14" font-family="monospace" font-size="9" font-weight="bold" fill="#7dd3fc">K=17</text>
    <text x="-15" y="20" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" fill="#94a3b8">Handoff</text>
  </g>

  <!-- GPU 2: Stage 1 (Layers 17..47 + Expert Cache) -->
  <g transform="translate(515, 305)">
    <rect width="440" height="310" rx="10" fill="url(#gpu2Grad)" stroke="#a855f7" stroke-width="2"/>
    <rect width="440" height="36" rx="10" fill="#581c87"/>
    <rect y="26" width="440" height="10" fill="#581c87"/>
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">GPU 2: Tesla PG500-216 (CUDA 1)</text>
    <text x="340" y="24" font-family="monospace" font-size="11" fill="#f3e8ff">Bus 08:00.0</text>

    <!-- Sub-blocks for GPU 2 -->
    <rect x="15" y="48" width="410" height="48" rx="6" fill="#2e1065" stroke="#c084fc" stroke-width="1"/>
    <text x="25" y="68" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#e9d5ff">Transformer Layers 17 – 47 + LM Head</text>
    <text x="25" y="85" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" fill="#cbd5e1">31 Attention Layers, RMSNorm, Final Logits Output</text>

    <!-- The Monster Expert Cache block -->
    <rect x="15" y="104" width="410" height="104" rx="6" fill="#3b0764" stroke="#e879f9" stroke-width="1.5"/>
    <text x="25" y="126" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#f0abfc">VRAM High-Speed Expert Cache: 23.25 GiB</text>
    <text x="25" y="146" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#fdf4ff">8,002 Locked Expert Slots (out of 8,632 total in VRAM)</text>
    <text x="25" y="166" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Servicing 97.0% – 98.5% of routed tokens directly on Tensor Cores</text>
    <text x="25" y="184" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" fill="#cbd5e1">• High-speed x16 link minimizes latency when streaming misses from RAM</text>
    <text x="25" y="200" font-family="monospace" font-size="10" fill="#e879f9">Hit Latency: Microseconds · Miss Stream: 13.1 GB/s</text>

    <rect x="15" y="216" width="410" height="44" rx="6" fill="#2e1065" stroke="#818cf8" stroke-width="1"/>
    <text x="25" y="234" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc">KV Resident Cache &amp; Pipeline Staging: 2.18 GiB</text>
    <text x="25" y="250" font-family="monospace" font-size="10" fill="#c7d2fe">65,536 resident tokens (int8) + stage activations</text>

    <rect x="15" y="268" width="410" height="30" rx="5" fill="#581c87"/>
    <text x="120" y="288" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">TOTAL VRAM: 32,010 / 32,768 MiB (97.7%)</text>
  </g>
</svg>