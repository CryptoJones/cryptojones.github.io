<div class="posts">
  {% for post in site.posts %}

      <div class="post-meta">{{ post.date | date: "%Y.%m.%d" }}</div>
      <h2 class="post-title"><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h2>
      <div class="post-excerpt">{{ post.excerpt | strip_html | truncatewords: 30 }}</div>

    </article>
  {% endfor %}
</div>
