const COLORS={"Character": "#39ff5e", "Place": "#35d0e6", "Company": "#f0b429", "Group": "#b98cff", "Item": "#ff6b8a", "Plot Point": "#ffd23f"};
const el=document.getElementById('g'), tip=document.getElementById('tip');
const Graph=ForceGraph3D()(el)
  .showNavInfo(false)
  .backgroundColor('#050705')
  .graphData(DATA)
  .nodeVal(n=>1.5+Math.sqrt(n.deg))
  .nodeColor(n=>COLORS[n.type]||'#9effbd')
  .nodeOpacity(0.95)
  .nodeResolution(12)
  .nodeLabel(()=> '')
  .linkColor(()=> 'rgba(57,255,94,0.28)')
  .linkWidth(0.4)
  .linkDirectionalParticles(1)
  .linkDirectionalParticleWidth(0.9)
  .linkDirectionalParticleColor(()=> '#39ff5e')
  .linkDirectionalParticleSpeed(0.006)
  .warmupTicks(60)
  .cooldownTicks(220)
  .onNodeHover(n=>{
    el.style.cursor=n?'pointer':'default';
    if(!n){tip.style.display='none';return;}
    tip.innerHTML='<b>'+n.title+'</b><em>'+n.type+'</em>'+(n.desc?'<p>'+n.desc+'</p>':'');
    tip.style.display='block';
  })
  .onNodeClick(n=>{
    const d=Math.hypot(n.x,n.y,n.z)||1, r=1+120/d;
    Graph.cameraPosition({x:n.x*r,y:n.y*r,z:n.z*r}, n, 900);
  });
Graph.d3Force('charge').strength(-90);
addEventListener('mousemove',e=>{tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';});
addEventListener('resize',()=>Graph.width(innerWidth).height(innerHeight));
</script>
